<!-- Floating Chat Button (FAB) -->
<button class="chat-fab shadow-lg" (click)="toggleChat()" [class.chat-open]="chatVisible" title="Open AI Support">
  <img *ngIf="!chatVisible" src="assets/images/chat-agent.png" style="width: 32px; height: 32px; object-fit: contain;" />
  <i *ngIf="chatVisible" class="fa-solid fa-xmark" style="font-size: 1.4rem;"></i>
</button>

<!-- Floating AI Chat Panel -->
<div class="floating-chat-container shadow-lg" [class.show]="chatVisible" [class.theme-dark]="isDarkTheme" [class.theme-light]="!isDarkTheme" [class.maximized]="isMaximized">
  <div class="chat-header d-flex align-items-center justify-content-between p-3 border-bottom">
    <div class="d-flex align-items-center">
      <div class="rounded-circle p-1 me-2">
        <img src="assets/images/chat-agent.png" style="width: 32px; height: 32px; object-fit: contain;" />
      </div>
      <div>
        <h6 class="mb-0 fw-bold chat-header-title" style="font-size: 0.9rem;">AI Virtual Support</h6>
        <!-- Current Device Context -->
        <span class="text-success" style="font-size: 0.72rem; display: block;" *ngIf="selectedDeviceName">
          <span class="spinner-grow spinner-grow-sm text-success me-1" style="width: 6px; height: 6px; display: inline-block;"></span>
          Agent for: <strong>{{selectedDeviceName}}</strong>
        </span>
        <span class="text-success" style="font-size: 0.72rem; display: block;" *ngIf="!selectedDeviceName">
          <span class="spinner-grow spinner-grow-sm text-success me-1" style="width: 6px; height: 6px; display: inline-block;"></span>
          Online Assistant
        </span>
      </div>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <!-- Theme toggle -->
      <button cButton color="dark" size="sm" class="py-0 px-2 btn-icon" (click)="toggleTheme()" [title]="isDarkTheme ? 'Switch to Light Theme' : 'Switch to Dark Theme'" style="background: transparent; border: none;">
        <i class="fa-solid" [class.fa-sun]="isDarkTheme" [class.fa-moon]="!isDarkTheme" [class.text-warning]="isDarkTheme" [class.text-secondary]="!isDarkTheme"></i>
      </button>
      <!-- Maximize toggle -->
      <button cButton color="dark" size="sm" class="py-0 px-2 btn-icon" (click)="toggleMaximize()" [title]="isMaximized ? 'Minimize Chat' : 'Maximize Chat'" style="background: transparent; border: none;">
        <i class="fa-solid" [class.fa-compress]="isMaximized" [class.fa-expand]="!isMaximized" [class.text-white-50]="isDarkTheme" [class.text-secondary]="!isDarkTheme"></i>
      </button>
      <!-- History toggle -->
      <button cButton color="dark" size="sm" class="py-0 px-2 btn-icon" (click)="toggleSessionsList()" [title]="showSessionsList ? 'Show Chat' : 'Chat History / Sessions'" style="background: transparent; border: none;">
        <i class="fa-solid" [class.fa-comments]="showSessionsList" [class.fa-clock-rotate-left]="!showSessionsList" [class.text-info]="showSessionsList" [class.text-white-50]="!showSessionsList && isDarkTheme" [class.text-secondary]="!showSessionsList && !isDarkTheme"></i>
      </button>
      <!-- Minimize/Close widget -->
      <button cButton color="dark" size="sm" class="py-0 px-2 btn-icon" (click)="toggleChat()" style="background: transparent; border: none;">
        <i class="fa-solid fa-chevron-down" [class.text-white-50]="isDarkTheme" [class.text-secondary]="!isDarkTheme"></i>
      </button>
    </div>
  </div>

  <!-- Messages List View -->
  <div *ngIf="!showSessionsList" class="chat-messages p-3" style="overflow-y: auto;" #chatScrollContainer>
    <div class="d-flex flex-column gap-3">
      <ng-container *ngFor="let msg of chatHistory">
        <div *ngIf="['user', 'assistant', 'model'].includes(msg.role) && (msg.role === 'user' || (msg.content && !msg.content.startsWith('[SYSTEM')))" class="d-flex" [class.justify-content-end]="msg.role === 'user'">
          <div *ngIf="['assistant', 'model'].includes(msg.role)" class="d-flex gap-2" style="max-width: 85%;">
            <div class="rounded-circle bg-success bg-opacity-10 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; flex-shrink: 0;">
              <i class="fa-solid fa-robot text-success" style="font-size: 0.85rem;"></i>
            </div>
            <div class="p-2 rounded-3 assistant-bubble" style="font-size: 0.85rem; line-height: 1.4; white-space: pre-wrap;">
              {{msg.content}}
            </div>
          </div>
          <div *ngIf="msg.role === 'user'" class="d-flex gap-2 justify-content-end" style="max-width: 85%;">
            <div class="p-2 rounded-3 user-bubble text-white" style="font-size: 0.85rem; line-height: 1.4;">
              {{msg.content}}
            </div>
            <div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; flex-shrink: 0;">
              <i class="fa-solid fa-user text-primary" style="font-size: 0.85rem;"></i>
            </div>
          </div>
        </div>
      </ng-container>
      <div *ngIf="sendingChat" class="d-flex gap-2">
        <div class="rounded-circle bg-success bg-opacity-10 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
          <i class="fa-solid fa-robot text-success" style="font-size: 0.85rem;"></i>
        </div>
        <div class="p-2 rounded-3 assistant-bubble d-flex align-items-center" style="font-size: 0.85rem;">
          <span class="spinner-border spinner-border-sm me-2 text-success" role="status"></span>
          Typing response...
        </div>
      </div>
    </div>
  </div>

  <!-- Sessions List View -->
  <div *ngIf="showSessionsList" class="chat-messages p-3" style="overflow-y: auto;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="mb-0 sessions-header-title" style="font-size: 0.85rem;"><i class="fa-solid fa-clock-rotate-left me-1"></i> Sessions</h6>
      <button cButton color="primary" size="sm" class="py-0.5 px-2" (click)="createNewSessionFromUI()" style="font-size: 0.75rem;">
        <i class="fa-solid fa-plus me-1"></i> New Session
      </button>
    </div>

    <div *ngIf="loadingSessions" class="text-center py-4">
      <c-spinner color="info" size="sm"></c-spinner>
    </div>

    <div *ngIf="!loadingSessions && chatSessions.length === 0" class="text-center py-4 text-muted" style="font-size: 0.8rem;">
      No saved sessions found.
    </div>

    <div *ngIf="!loadingSessions && chatSessions.length > 0" class="d-flex flex-column gap-2">
      <div *ngFor="let s of chatSessions" 
           class="p-2 rounded-3 d-flex align-items-center justify-content-between cursor-pointer session-item"
           [class.active]="activeSessionId === s.id"
           (click)="selectSessionFromUI(s.id)">
        
        <div class="d-flex flex-column flex-grow-1 overflow-hidden me-2">
          <!-- Rename input if editing -->
          <div *ngIf="renameSessionId === s.id" class="d-flex align-items-center gap-1 w-100" (click)="$event.stopPropagation()">
            <input cFormControl size="sm" class="bg-dark text-white border-secondary py-0 px-2" style="font-size: 0.8rem; height: 24px;" [(ngModel)]="renameTitle" (keyup.enter)="saveRenameSession(s.id)" autofocus />
            <button cButton color="success" size="sm" class="py-0 px-1" (click)="saveRenameSession(s.id)" style="height: 24px;"><i class="fa-solid fa-check" style="font-size: 0.75rem;"></i></button>
            <button cButton color="secondary" size="sm" class="py-0 px-1" (click)="cancelRenameSession($event)" style="height: 24px;"><i class="fa-solid fa-xmark" style="font-size: 0.75rem;"></i></button>
          </div>
          <!-- Title text if not editing -->
          <div *ngIf="renameSessionId !== s.id" class="text-truncate fw-semibold session-title" style="font-size: 0.85rem; max-width: 210px;">
            {{s.title}}
          </div>
          <small class="text-muted" style="font-size: 0.68rem; margin-top: 2px;">
            {{s.modified | date:'short'}}
          </small>
        </div>

        <!-- Action buttons -->
        <div class="d-flex gap-1" (click)="$event.stopPropagation()">
          <button *ngIf="renameSessionId !== s.id" cButton color="dark" size="sm" class="py-0 px-1 text-muted btn-icon" (click)="startRenameSession(s, $event)" title="Rename" style="background: transparent; border: none;">
            <i class="fa-solid fa-pen" style="font-size: 0.75rem;"></i>
          </button>
          <button cButton color="dark" size="sm" class="py-0 px-1 text-danger btn-icon" (click)="deleteSession(s.id)" title="Delete" style="background: transparent; border: none;">
            <i class="fa-solid fa-trash" style="font-size: 0.75rem;"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Message Input Area -->
  <div *ngIf="!showSessionsList" class="chat-input-area p-3" style="border-top: 1px solid rgba(0,0,0,0.08);">
    <!-- Dummy inputs to capture Firefox credential autofill -->
    <input type="text" name="fake_username" style="display: none;" aria-hidden="true" autocomplete="off" />
    <input type="password" name="fake_password" style="display: none;" aria-hidden="true" autocomplete="off" />

    <div class="input-group">
      <input type="search" name="search" cFormControl class="chat-input" [class.text-white]="isDarkTheme" [class.text-dark]="!isDarkTheme" placeholder="Ask anything about your router..." 
             [(ngModel)]="chatInput" (keyup.enter)="sendChatMessage()" [disabled]="sendingChat" style="font-size: 0.85rem;" autocomplete="new-password" />
      <button cButton [color]="isDarkTheme ? 'primary' : 'primary'" (click)="sendChatMessage()" [disabled]="!chatInput.trim() || sendingChat">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>
