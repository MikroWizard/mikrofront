    <!-- Global Device Select for Customers -->
    <div class="d-flex align-items-center gap-2 me-auto ms-3" *ngIf="current_user && current_user.role === 'customer'" style="margin-left: 20px;">
      <label for="globalDeviceSelect" class="fw-semibold text-muted mb-0" style="font-size: 0.85rem;">Selected Router:</label>
      <select id="globalDeviceSelect" class="form-select form-select-sm w-auto fw-bold" [(ngModel)]="selectedDeviceId" (change)="onDeviceChange()" style="font-size: 0.85rem; border-color: #3b82f6; cursor: pointer; padding: 0.25rem 2rem 0.25rem 0.75rem;">
        <option *ngFor="let dev of devices" [value]="dev.id">{{dev.name}} ({{dev.ip}})</option>
      </select>
    </div>

    <c-header-nav class="ms-auto d-flex align-items-center">

              class="btn btn-sm btn-connection-mgr me-3" 
              (click)="navigateToConnectionManager()"

              title="Launch Remote Terminal & Desktop Connection Manager">

      </button>

      <ng-container *ngTemplateOutlet="userDropdown"></ng-container>
    </c-header-nav>

<ng-template #userDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button
      cButton
      color=""
      [caret]="false"
      cDropdownToggle
      class="py-0"
    >
      <svg cIcon class="me-2" name="cilUser"></svg>
      {{fname}} {{lname}}
    </button>
    <ul cDropdownMenu class="pt-0 pr-3 w-auto shadow-lg" style="min-width: 220px;">
      <li>
        <h6 cDropdownHeader class="bg-light fw-semibold py-2">User Menu</h6>
      </li>
      <li *ngIf="!current_user || current_user.role !== 'customer'">
        <div class="px-3 py-2 border-bottom">
          <small class="text-muted fw-bold text-uppercase d-block mb-1" style="font-size: 0.7rem; letter-spacing: 0.5px;">
            Workspace Mode
          </small>
          <div class="d-flex flex-column gap-1">
            <button type="button" 
                    class="btn btn-sm text-start d-flex align-items-center justify-content-between px-2 py-1 rounded" 
                    [ngClass]="uiModeService.currentMode === 'both' ? 'btn-primary text-white' : 'btn-light text-dark'"
                    (click)="setMode('both')">
              <span><i class="fa-solid fa-layer-group me-2"></i>All Features</span>
              <i class="fa-solid fa-check" *ngIf="uiModeService.currentMode === 'both'"></i>
            </button>
            <button type="button" 
                    class="btn btn-sm text-start d-flex align-items-center justify-content-between px-2 py-1 rounded" 
                    [ngClass]="uiModeService.currentMode === 'mikrotik' ? 'btn-primary text-white' : 'btn-light text-dark'"
                    (click)="setMode('mikrotik')">
              <span><i class="fa-solid fa-router me-2"></i>MikroTik Only</span>
              <i class="fa-solid fa-check" *ngIf="uiModeService.currentMode === 'mikrotik'"></i>
            </button>
            <button type="button" 
                    class="btn btn-sm text-start d-flex align-items-center justify-content-between px-2 py-1 rounded" 
                    [ngClass]="uiModeService.currentMode === 'pam' ? 'btn-primary text-white' : 'btn-light text-dark'"
                    (click)="setMode('pam')">
              <span><i class="fa-solid fa-shield-halved me-2"></i>PAM &amp; Automation</span>
              <i class="fa-solid fa-check" *ngIf="uiModeService.currentMode === 'pam'"></i>
            </button>
          </div>
        </div>
      </li>
      <li>
        <button (click)="callParent('password')" cDropdownItem>
          <svg cIcon class="me-2" name="cilUser"></svg>
          Change password
        </button>
      </li>
      <li>
        <button (click)="callParent('otp')" cDropdownItem>
          <svg cIcon class="me-2" name="cilUser"></svg>
          setup otp
        </button>
      </li>
      <li>
        <hr class="dropdown-divider my-1">
      </li>
      <li>
        <a routerLink="./" (click)="logout()" cDropdownItem class="text-danger">
          <svg cIcon class="me-2" name="cilExitToApp"></svg>
          Logout
        </a>
      </li>
    </ul>
  </c-dropdown>
</ng-template>

<ng-template #taskDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button
      cButton
      color=""
      [caret]="false"
      cDropdownToggle
      class="py-0"
      style="margin-right: 20px;"
    >
    <i class="fa-solid fa-gear"></i><c-badge color="danger" style="left: unset !important;" position="bottom-end" shape="rounded-pill">{{tasks.length}}</c-badge>
    </button>
    <ul cDropdownMenu class="pt-0 pr-5 w-auto">
      <li>
        <h6 cDropdownHeader class="bg-light fw-semibold py-2">Runnig Background Tasks</h6>
      </li>
      <li>
        <table cTable small style="min-width: 250px;">
          <thead style="font-size: 0.9rem;">
          <tr>
            <th scope="col"></th>
            <th scope="col" style="color: darkgrey;">Task name</th>
            <th scope="col" style="width: 60px;"></th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let task of tasks; let i = index">
            <th scope="row">{{i+1}}</th>
            <td>{{task.name}}</td>
            <td>
              <!-- <button (click)="stop_task(task['signal'])" cButton  variant="ghost" color="danger" size="sm" ><i class="fa-solid fa-stop"></i></button> -->
              <button (click)="callParentConfirm('CancelTask',task)"  cButton  variant="ghost" color="danger" size="sm" ><i class="fa-solid fa-stop"></i></button>
            </td>
          </tbody>
        </table>
      </li>
    </ul>
  </c-dropdown>
</ng-template>
